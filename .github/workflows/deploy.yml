name: Deploy

# Deploys Firestore rules + indexes and Firebase Hosting to the production project.
# Runs on every push to `main`, or manually from the Actions tab ("Run workflow").
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FIREBASE_PROJECT: life-management-de315
      # Firebase web config: public by design (it identifies the project; security
      # rules protect the data). Kept here so CI needs no extra setup. See DECISIONS D20.
      VITE_FIREBASE_API_KEY: AIzaSyDaSy0Z-YZT4XK1283aF_ZUCkdN3xzHf1U
      VITE_FIREBASE_AUTH_DOMAIN: life-management-de315.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: life-management-de315
      VITE_FIREBASE_APP_ID: 1:290995869060:web:a8f40b73d254ebda2839d1
    steps:
      - name: Check deploy credentials are configured
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::Repository secret FIREBASE_SERVICE_ACCOUNT is not set. See docs/SETUP.md step B3c."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}
      - run: npm ci

      # Never deploy something that fails lint, types, unit or rules tests.
      - run: npm run check

      - name: Build web app (production config)
        run: npm -w web run build

      - name: Authenticate to Google Cloud
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Deploy rules, indexes and hosting
        working-directory: firebase
        run: >
          npx firebase deploy
          --project "$FIREBASE_PROJECT"
          --only firestore:rules,firestore:indexes,hosting
          --non-interactive
          --message "${GITHUB_SHA::7} via GitHub Actions"

      - name: Remove credentials file
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
